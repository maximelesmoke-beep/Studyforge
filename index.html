<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>StudyForge — Araphax</title></head><body><header><b>StudyForge</b> · Araphax</header><main>
<section id="setup" class="card"><h1>Construis ta maîtrise.</h1><p>Un parcours qui s'adapte à tes résultats.</p><div class="grid"><label>Niveau<select id="level"><option>Collège</option><option>Lycée</option><option>Bac</option><option>Université</option><option>Avancé</option></select></label><label>Matière<select id="subject"></select></label><label>Objectif<select id="goal"><option>Comprendre</option><option>Préparer un examen</option><option>Maîtriser</option></select></label><label>Temps<select id="time"><option>20 min</option><option>30 min</option><option>45 min</option><option>60 min</option></select></label></div><button id="start">Créer mon parcours</button></section>
<section id="home" hidden><div class="hero"><div><small>PARCOURS</small><h2 id="title"></h2><p id="sub"></p></div><strong id="xp">0 XP</strong></div><div class="stats"><div>Maîtrise<strong id="mastery"></strong></div><div>Série<strong id="streak"></strong></div><div>Compétences<strong id="count"></strong></div></div><div class="card"><h3>Plan adaptatif</h3><div id="plan"></div></div><div class="nav"><button data-page="course">Cours</button><button data-page="practice">Exercices</button><button data-page="quiz">Quiz</button><button data-page="secrets">Secrets</button><button data-page="chat">Araphax</button><button data-page="focus">Focus</button></div></section>
<section id="course" class="page" hidden><button class="back">← Accueil</button><div id="courseBox"></div></section><section id="practice" class="page" hidden><button class="back">← Accueil</button><div id="practiceBox"></div></section><section id="quiz" class="page" hidden><button class="back">← Accueil</button><div id="quizBox"></div></section><section id="secrets" class="page" hidden><button class="back">← Accueil</button><div id="secretBox"></div></section>
<section id="chat" class="page" hidden><button class="back">← Accueil</button><div class="card"><h2>Araphax</h2><div class="chips"><button data-mode="prof">Prof</button><button data-mode="socrate">Socratique</button><button data-mode="coach">Coach</button><button data-mode="corrector">Correcteur</button><button data-mode="deep">Approfondir</button></div><div id="messages"></div><div class="row"><input id="msg" placeholder="Ta question…"><button id="send">Envoyer</button></div></div></section>
<section id="focus" class="page" hidden><button class="back">← Accueil</button><div class="card center"><h2>Concentration</h2><div id="timer">25:00</div><button id="timerBtn">Démarrer</button></div></section></main><script src="app.js"></script></body></html>
